name: Customer app typecheck
on:
  pull_request:
  push:
    branches:
      - feat/customer-installment-checkout
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --noEmit
